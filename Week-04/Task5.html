<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Task 5 - JavaScript Events</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            padding: 30px;
        }

        .container {
            max-width: 650px;
            margin: auto;
            background-color: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }

        input,
        select {
            width: 100%;
            padding: 10px;
            margin: 8px 0 15px;
            box-sizing: border-box;
        }

        button {
            padding: 10px 20px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        #mouseBox {
            margin-top: 20px;
            padding: 30px;
            text-align: center;
            background-color: lightblue;
            border-radius: 8px;
        }

        #output {
            margin-top: 20px;
            padding: 15px;
            background-color: #eeeeee;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>JavaScript Events</h1>

        <label>Enter Your Name:</label>

        <input
            type="text"
            id="nameInput"
            placeholder="Type your name"
        >

        <p id="inputMessage">
            Start typing...
        </p>


       >
        <label>Select Course:</label>

        <select id="courseSelect">

            <option value="">Select Course</option>
            <option value="HTML & CSS">HTML & CSS</option>
            <option value="JavaScript">JavaScript</option>
            <option value="React">React</option>
            <option value="Node.js">Node.js</option>

        </select>

        <p id="courseMessage"></p>


        <form id="studentForm">

            <label>Email:</label>

            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
            >

            <button type="submit">
                Submit
            </button>

        </form>


       
        <br>

        <button id="clickButton">
            Click Me
        </button>

        <p id="clickMessage"></p>


       
        <div id="mouseBox">
            Move your mouse over this box
        </div>


      
        <p>Press any key on your keyboard:</p>

        <input
            type="text"
            id="keyboardInput"
            placeholder="Press a key..."
        >

        <p id="keyMessage"></p>


        <div id="output">
            Event output will appear here.
        </div>

    </div>

    <script src="Task5.js"></script>

</body>
</html>
