<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Record Manager</title>

    <link rel="stylesheet" href="Task6.css">
</head>

<body>

    <div class="container">

        <h1>Student Record Manager</h1>

        <p class="subtitle">
            Add, view and manage student records using JavaScript.
        </p>

      
        <form id="studentForm">

            <div class="form-group">
                <label for="studentName">Student Name</label>

                <input
                    type="text"
                    id="studentName"
                    placeholder="Enter student name"
                    required
                >
            </div>


            <div class="form-group">
                <label for="studentCourse">Course</label>

                <select id="studentCourse" required>

                    <option value="">Select Course</option>

                    <option value="B.Tech CSE">
                        B.Tech CSE
                    </option>

                    <option value="B.Tech IT">
                        B.Tech IT
                    </option>

                    <option value="BCA">
                        BCA
                    </option>

                    <option value="MCA">
                        MCA
                    </option>

                    <option value="B.Tech ECE">
                      ECE
                    </option>

                    <option value="Mechanical">
                      Mechanical
                    </option>

                    <option value="MBA">
                      MBA
                    </option>

                     <option value="BA">
                      BA
                    </option>

                     <option value="MA">
                      MA
                    </option>

                     <option value="MBBS">
                      MBBS
                    </option>


                </select>
            </div>


            <div class="form-group">
                <label for="studentMarks">Marks</label>

                <input
                    type="number"
                    id="studentMarks"
                    placeholder="Enter marks"
                    min="0"
                    max="100"
                    required
                >
            </div>


            <button type="submit">
                Add Student
            </button>

        </form>


        

        <div class="search-section">

            <input
                type="text"
                id="searchInput"
                placeholder="Search student by name..."
            >

        </div>


       
        <h2>
            Student Records
            (<span id="studentCount">0</span>)
        </h2>


        
        <div id="studentList">

            <p class="empty-message">
                No student records available.
            </p>

        </div>

    </div>


    <script src="Task6.js"></script>

</body>
</html>
